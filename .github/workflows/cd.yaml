name: simple-project
on:
  push:
    branches:
      - origin

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Pull  Docker image
        run: 
          docker pull bitblog:1
          docker run -d -p 3000:3000 bitblog:1

      